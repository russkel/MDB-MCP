[project]
name = "gdb-mcp"
version = "0.1.0"
description = "A Model Context Protocol server for GDB debugging functionality"
authors = [
    {name = "smadi0x86", email = "smadi0x86dev@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # mcp 2.x renamed FastMCP -> MCPServer and changed other APIs; server.py is v1 code,
    # so an unbounded range resolves to 2.x and the server dies at import.
    "mcp>=1.12.2,<2",
    "mcp[cli]>=1.10.1,<2",
    "pygdbmi>=0.11.0.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    # Official TOON encoder used server-side to format structured-tool output.
    # Pinned to the immutable beta tag (PyPI 0.1.0 is a non-functional stub).
    "toon-format @ git+https://github.com/toon-format/toon-python@v0.9.0-beta.1",
]

[project.scripts]
gdb-mcp = "server:main"

[project.urls]
Homepage = "https://github.com/smadi0x86/gdb-mcp"
Repository = "https://github.com/smadi0x86/gdb-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The toon-format dependency is a direct git reference (the working release isn't on
# PyPI), which hatchling rejects unless this is set.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["modules"]
# server.py is a standalone top-level module (not inside a package), so it must
# be force-included to land at the wheel root and stay importable as `server`.
force-include = { "server.py" = "server.py" }
